<form class="filters" role="search" aria-label="Filter policies" (submit)="$event.preventDefault()">
  <div class="filters__field filters__field--search">
    <label for="filter-search">Search</label>
    <input
      id="filter-search"
      type="search"
      placeholder="Policy number, holder, or underwriter"
      [ngModel]="searchModel()"
      (ngModelChange)="onSearchInput($event)"
      name="search"
      autocomplete="off"
    />
  </div>

  <div class="filters__field">
    <label for="filter-status">Status</label>
    <select id="filter-status" [ngModel]="status() ?? ''" (ngModelChange)="onStatusChange($event)" name="status">
      <option value="">All statuses</option>
      @for (s of statuses; track s) {
        <option value="{{ s }}">{{ s }}</option>
      }
    </select>
  </div>

  <div class="filters__field">
    <label for="filter-lob">Line of business</label>
    <select
      id="filter-lob"
      [ngModel]="lineOfBusiness() ?? ''"
      (ngModelChange)="onLineOfBusinessChange($event)"
      name="lineOfBusiness"
    >
      <option value="">All lines</option>
      @for (l of linesOfBusiness; track l) {
        <option value="{{ l }}">{{ l }}</option>
      }
    </select>
  </div>

  <div class="filters__field">
    <label for="filter-region">Region</label>
    <input
      id="filter-region"
      type="text"
      placeholder="e.g. Singapore"
      [ngModel]="region() ?? ''"
      (ngModelChange)="onRegionChange($event)"
      name="region"
      autocomplete="off"
    />
  </div>

  <div class="filters__field">
    <label for="filter-date-from">Effective from</label>
    <input
      id="filter-date-from"
      type="date"
      [ngModel]="effectiveDateFrom() ?? ''"
      (ngModelChange)="onDateFromChange($event)"
      name="effectiveDateFrom"
    />
  </div>

  <div class="filters__field">
    <label for="filter-date-to">Effective to</label>
    <input
      id="filter-date-to"
      type="date"
      [ngModel]="effectiveDateTo() ?? ''"
      (ngModelChange)="onDateToChange($event)"
      name="effectiveDateTo"
    />
  </div>

  @if (hasActiveFilters()) {
    <button type="button" class="filters__reset" (click)="reset.emit()">Clear filters</button>
  }
</form>
