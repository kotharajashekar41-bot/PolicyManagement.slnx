server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — Angular's router handles the actual 404 vs. redirect logic client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin in production (see environment.prod.ts's apiBaseUrl: '/api/v1'), so no
    # CORS config is needed there — this proxies straight through to the BFF container.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
